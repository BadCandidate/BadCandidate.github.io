<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=/vi" />
    <script>
        // Get current URL parameters
        const currentParams = window.location.search;
        
        // Redirect to /vi while preserving any URL parameters
        window.location.href = "/vi" + currentParams;
    </script>
</head>
<body>
    Redirecting to <a href="/vi">Vietnamese version</a>...
</body>
</html>
