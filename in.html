<body class="bg-gray-100 text-gray-800" data-theme="light">


    <div class="container mx-auto p-4">
        <header class="text-center mb-8" role="banner">
            <!-- <nav class="mb-4" role="navigation" aria-label="Breadcrumb">
                <ol class="flex justify-center items-center space-x-2 text-sm text-gray-600">
                    <li><a href="/#disqus_thread" class="hover:text-blue-600 transition-colors">Home</a></li>
                    <li><span aria-hidden="true">/</span></li>
                    <li aria-current="page">Document Review</li>
                </ol>
            </nav> -->
            
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">Candidate Review</h1>
            <p class="text-gray-600 mt-2">Read the document and leave your comments below.</p>
        </header>

        <!-- Main content grid: 1 column on mobile, 2/3 and 1/3 on desktop -->
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8" role="main">

            <!-- Left Side: PDF Viewer (2/3 width on desktop) -->
            <section class="bg-white p-6 rounded-lg shadow-lg flex flex-col lg:col-span-2" aria-labelledby="viewer-heading">
                <h2 id="viewer-heading" class="text-2xl font-semibold mb-4 border-b pb-2">Document Viewer</h2>
                
                <!-- PDF.js will render the PDF page on this canvas -->
                <div id="pdf-viewer-container" class="flex-grow flex justify-center items-start bg-gray-50 p-4 rounded-md" role="region" aria-label="PDF Document">
                     <canvas id="pdf-canvas" aria-label="PDF Document Content"></canvas>
                </div>
                
                <!-- Bottom controls outside the PDF viewer -->
                <div class="flex justify-between items-center mt-4 gap-4 border-t pt-4 bg-white/90 backdrop-blur-sm shadow-lg pdf-bottom-controls" role="toolbar" aria-label="Document controls">
                    <!-- Redirect to PDF button (bottom left) -->
                    <a id="redirect-pdf-btn" href="#" target="_blank" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300 flex items-center gap-2" aria-label="Open PDF in new tab">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        Open PDF
                    </a>
                    
                    <!-- PDF Navigation Controls (bottom right) -->
                    <div class="flex items-center gap-2" role="group" aria-label="Page navigation">
                        <button id="prev-page" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300 disabled:bg-gray-300" aria-label="Go to previous page">
                            Previous
                        </button>
                        <div class="bg-white text-gray-800 font-semibold py-2 px-4 border rounded-md" role="status" aria-live="polite">
                            <span>Page </span>
                            <span id="page-num"></span>
                            <span> of </span>
                            <span id="page-count"></span>
                        </div>
                        <button id="next-page" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition-colors duration-300 disabled:bg-gray-300" aria-label="Go to next page">
                            Next
                        </button>
                    </div>
                </div>
                
                <div id="loader" class="text-center p-4" role="status" aria-live="polite">Loading Document...</div>
            </section>

            <!-- Right Side: Disqus Comments -->
            <aside class="bg-white p-6 rounded-lg shadow-lg" aria-labelledby="comments-heading">
                <h2 id="comments-heading" class="text-2xl font-semibold mb-4 border-b pb-2">Comments</h2>
                
                <!-- Disqus Comments Plugin -->
                <div id="comments-container">
                    <div id="disqus_thread" aria-label="Community comments section"></div>
                    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
                </div>
            </aside>
        </main>
        
        <!-- Footer with additional information -->
        <footer class="mt-8 text-center text-gray-600 text-sm" role="contentinfo">
            <p>This tool is part of the <a href="/#disqus_thread" class="text-blue-600 hover:underline">Bad Candidate</a> platform for transparent candidate evaluation.</p>
            <p class="mt-2">For questions or support, visit our <a href="https://github.com/orgs/BadCandidate/discussions" class="text-blue-600 hover:underline" target="_blank" rel="noopener">GitHub Discussions</a>.</p>
        </footer>
    </div>
