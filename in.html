<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer & Comments</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF.js library from Mozilla -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>

    <style>
        /* Custom styles for a better look */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style for the PDF viewer container to have a max height and scroll */
        #pdf-viewer-container {
            max-height: 90vh;
            overflow: auto;
        }
        /* Ensure the canvas is not distorted */
        #pdf-canvas {
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Facebook SDK for JavaScript -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v18.0" nonce="XYZ"></script>

    <div class="container mx-auto p-4">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Document Review</h1>
            <p class="text-gray-600 mt-2">Read the document and leave your comments below.</p>
        </header>

        <!-- Main content grid: 1 column on mobile, 2 on desktop -->
        <main class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- Left Side: PDF Viewer -->
            <div class="bg-white p-6 rounded-lg shadow-lg flex flex-col">
                <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Document Viewer</h2>
                
                <!-- PDF.js will render the PDF page on this canvas -->
                <div id="pdf-viewer-container" class="flex-grow flex justify-center items-start bg-gray-50 p-4 rounded-md">
                     <canvas id="pdf-canvas"></canvas>
                </div>

                <!-- PDF Navigation Controls -->
                <div class="flex items-center justify-center mt-4 p-2 rounded-lg bg-gray-100">
                    <button id="prev-page" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-l-md transition-colors duration-300 disabled:bg-gray-300">
                        Previous
                    </button>
                    <div class="bg-white text-gray-800 font-semibold py-2 px-6">
                        <span>Page </span>
                        <span id="page-num"></span>
                        <span> of </span>
                        <span id="page-count"></span>
                    </div>
                    <button id="next-page" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-r-md transition-colors duration-300 disabled:bg-gray-300">
                        Next
                    </button>
                </div>
                 <div id="loader" class="text-center p-4">Loading Document...</div>
            </div>

            <!-- Right Side: Facebook Comments -->
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Comments</h2>
                
                <!-- 
                  Facebook Comments Plugin.
                  IMPORTANT: Replace 'https://developers.facebook.com/docs/plugins/comments/' 
                  with the actual URL of the page where you host this file.
                -->
                <div class="fb-comments" 
                     data-href="https://developers.facebook.com/docs/plugins/comments/" 
                     data-width="100%" 
                     data-numposts="5">
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- PDF.js Setup ---

        // The URL for the PDF file you provided.
        const url = 'https://badcandidate.github.io/dinh_huu_luan.pdf';

        // Set worker source for PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        const scale = 1.5;
        
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('loader');

        /**
         * Get page info from document, resize canvas accordingly, and render page.
         * @param num Page number.
         */
        function renderPage(num) {
            pageRendering = true;
            
            // Using promise to fetch the page
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                // Render PDF page into canvas context
                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                const renderTask = page.render(renderContext);

                // Wait for rendering to finish
                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        // New page rendering is pending
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            // Update page counters
            document.getElementById('page-num').textContent = num;
            updateNavButtons();
        }
        
        /**
         * If another page rendering in progress, waits until the rendering is
         * finished. Otherwise, executes rendering immediately.
         */
        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        /**
         * Displays previous page.
         */
        function onPrevPage() {
            if (pageNum <= 1) {
                return;
            }
            pageNum--;
            queueRenderPage(pageNum);
        }
        document.getElementById('prev-page').addEventListener('click', onPrevPage);

        /**
         * Displays next page.
         */
        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) {
                return;
            }
            pageNum++;
            queueRenderPage(pageNum);
        }
        document.getElementById('next-page').addEventListener('click', onNextPage);
        
        /**
         * Disables or enables navigation buttons based on the current page.
         */
        function updateNavButtons() {
            document.getElementById('next-page').disabled = (pageNum >= pdfDoc.numPages);
            document.getElementById('prev-page').disabled = (pageNum <= 1);
        }

        /**
         * Asynchronously downloads PDF.
         */
        pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
            pdfDoc = pdfDoc_;
            document.getElementById('page-count').textContent = pdfDoc.numPages;
            loader.style.display = 'none'; // Hide loader
            renderPage(pageNum);
        }).catch(function(error) {
            console.error('Error loading PDF: ' + error);
            loader.textContent = 'Failed to load PDF. Check the console for details.';
            // This can happen due to CORS policy. For a real project, 
            // ensure your PDF is served from the same origin or with proper CORS headers.
        });

    </script>
</body>
</html>
